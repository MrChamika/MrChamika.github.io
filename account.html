<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account — Jacket Masters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/inertia" rel="stylesheet">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="icon" type="image/png" href="letter-e.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; background: #050505; color: #fff; }

        .account-page { flex: 1; padding: 100px 5% 60px; max-width: 1000px; margin: 0 auto; width: 100%; }

        /* Profile Banner */
        .profile-banner {
            background: rgba(18,18,18,0.7);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 20px;
            padding: 32px;
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 32px;
            backdrop-filter: blur(20px);
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 8px 25px rgba(255,106,0,0.3);
        }

        .profile-info h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }
        .profile-info p { font-size: 0.85rem; color: rgba(255,255,255,0.5); }

        .logout-btn {
            margin-left: auto;
            background: rgba(255,71,87,0.1);
            border: 1px solid rgba(255,71,87,0.3);
            color: #ff4757;
            padding: 10px 20px;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .logout-btn:hover { background: rgba(255,71,87,0.2); transform: translateY(-2px); }

        /* Section title */
        .sec-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.8);
        }

        /* Orders */
        .orders-list { display: flex; flex-direction: column; gap: 16px; }

        .order-card {
            background: rgba(18,18,18,0.6);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px;
            transition: border-color 0.3s ease;
        }

        .order-card:hover { border-color: rgba(255,106,0,0.25); }

        .order-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-id { font-size: 0.8rem; color: rgba(255,255,255,0.4); font-family: monospace; }
        .order-date { font-size: 0.8rem; color: rgba(255,255,255,0.4); }

        .order-badge {
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .badge-pending    { background: rgba(255,165,0,0.15); color: #ffa500; border: 1px solid rgba(255,165,0,0.3); }
        .badge-paid       { background: rgba(76,209,55,0.12); color: #4cd137; border: 1px solid rgba(76,209,55,0.3); }
        .badge-shipped    { background: rgba(0,210,255,0.12); color: #00d2ff; border: 1px solid rgba(0,210,255,0.3); }
        .badge-delivered  { background: rgba(76,209,55,0.15); color: #4cd137; border: 1px solid rgba(76,209,55,0.4); }
        .badge-cancelled  { background: rgba(255,71,87,0.12); color: #ff4757; border: 1px solid rgba(255,71,87,0.3); }

        .order-items { display: flex; flex-direction: column; gap: 10px; }

        .order-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
        }

        .order-item img {
            width: 52px;
            height: 52px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .order-item-name { font-size: 0.88rem; font-weight: 600; }
        .order-item-meta { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 2px; }

        .order-item-price { margin-left: auto; font-weight: 700; font-size: 0.9rem; white-space: nowrap; }

        .order-total {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .empty-orders {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.35);
        }

        .empty-orders i { font-size: 3rem; margin-bottom: 16px; display: block; }
        .empty-orders a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            background: #fff;
            color: #000;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.82rem;
            transition: all 0.3s ease;
        }
        .empty-orders a:hover { background: #ff6a00; color: #000; }

        .loading-msg { text-align: center; padding: 40px; color: rgba(255,255,255,0.4); }

        @media (max-width: 600px) {
            .account-page { padding: 90px 4% 40px; }
            .profile-banner { flex-direction: column; text-align: center; }
            .logout-btn { margin: 0; }
            .order-item img { width: 42px; height: 42px; }
        }
    </style>
</head>
<body class="theme-orange">
    <div class="bg-glow"></div>

    <header class="main-header">
        <div class="logo">
            <a href="index.html" style="text-decoration:none; color:inherit;">
                <span class="logo-bold">JACKET</span><span>MASTERS</span>
            </a>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="nav-item">HOME</a>
            <a href="index.html#products-section" class="nav-item">SHOP</a>
            <a href="about.html" class="nav-item">ABOUT</a>
            <a href="contact.html" class="nav-item">CONTACT</a>
        </nav>
        <div class="header-actions">
            <a href="cart.html" class="action-btn cart-btn" aria-label="Cart" style="color:inherit; text-decoration:none;">
                <i class="fa-solid fa-bag-shopping"></i>
            </a>
        </div>
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu" onclick="toggleMobileMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <main class="account-page">

        <!-- Profile Banner -->
        <div class="profile-banner" id="profile-banner">
            <div class="avatar" id="user-avatar">?</div>
            <div class="profile-info">
                <h2 id="user-name">Loading...</h2>
                <p id="user-email"></p>
            </div>
            <button class="logout-btn" onclick="doLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Sign Out
            </button>
        </div>

        <!-- Orders -->
        <div class="sec-title">My Orders</div>
        <div class="orders-list" id="orders-list">
            <div class="loading-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading orders...</div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand"><span class="logo-bold">JACKET</span><span>MASTERS</span></div>
            <div class="footer-nav">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="privacy.html">Privacy</a>
                <a href="terms.html">Terms</a>
                <a href="refund.html">Refunds</a>
            </div>
            <div class="footer-copy">&copy; 2026 Jacket Masters. All rights reserved.</div>
        </div>
    </footer>

    <script type="module" src="account.js"></script>
    <script>
        function toggleMobileMenu() {
            var nav = document.querySelector('.nav-links');
            var icon = document.querySelector('#menu-toggle i');
            if (!nav) return;
            nav.classList.toggle('open');
            if (icon) icon.className = nav.classList.contains('open') ? 'fa-solid fa-times' : 'fa-solid fa-bars';
        }
        document.querySelectorAll('.nav-links .nav-item').forEach(function(link) {
            link.addEventListener('click', function() {
                document.querySelector('.nav-links').classList.remove('open');
                var icon = document.querySelector('#menu-toggle i');
                if (icon) icon.className = 'fa-solid fa-bars';
            });
        });
    </script>
</body>
</html>
