<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ItalionItalion</title>
    <meta name="description" content="Sign in or create your Italion account to track orders and save your favourites.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/inertia" rel="stylesheet">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; background: #050505; color: #fff; }

        .login-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 5% 60px;
            position: relative;
        }

        .login-card {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -40%;
            left: -40%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle, rgba(255,106,0,0.06) 0%, transparent 65%);
            pointer-events: none;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 4px;
        }

        .login-logo a { text-decoration: none; color: inherit; }
        .login-logo .bold { font-weight: 900; color: #ff6a00; }

        /* Tabs */
        .auth-tabs {
            display: flex;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            padding: 4px;
            margin-bottom: 32px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.45);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 10px 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #ff6a00;
            color: #000;
            box-shadow: 0 4px 15px rgba(255,106,0,0.4);
        }

        /* Form */
        .auth-form { display: flex; flex-direction: column; gap: 16px; }

        .form-group { display: flex; flex-direction: column; gap: 8px; }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.55);
        }

        .form-group input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 14px 16px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            width: 100%;
        }

        .form-group input:focus {
            border-color: rgba(255,106,0,0.6);
            box-shadow: 0 0 0 3px rgba(255,106,0,0.12);
        }

        .auth-btn {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 50px;
            padding: 15px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .auth-btn:hover {
            background: #ff6a00;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,106,0,0.4);
        }

        .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
            color: rgba(255,255,255,0.25);
            font-size: 0.75rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .google-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 50px;
            padding: 13px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-btn:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .google-icon { width: 18px; height: 18px; }

        .error-msg {
            background: rgba(255,71,87,0.12);
            border: 1px solid rgba(255,71,87,0.3);
            color: #ff4757;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.8rem;
            display: none;
        }

        .error-msg.show { display: block; }

        .success-msg {
            background: rgba(76,209,55,0.1);
            border: 1px solid rgba(76,209,55,0.3);
            color: #4cd137;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.8rem;
            display: none;
            text-align: center;
        }

        .success-msg.show { display: block; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover { color: #ff6a00; }

        /* Panel visibility */
        .auth-panel { display: none; }
        .auth-panel.active { display: flex; flex-direction: column; gap: 16px; }

        @media (max-width: 480px) {
            .login-card { padding: 32px 20px; border-radius: 16px; }
        }
    </style>
</head>
<body class="theme-orange">
    <div class="bg-glow"></div>

    <header class="main-header">
        <div class="logo">
            <a href="index.html" style="text-decoration:none; color:inherit;">
                <span class="logo-bold">ITALION</span>
            </a>
        </div>
        <div class="header-actions">
            <a href="cart.html" class="action-btn cart-btn" aria-label="Cart" style="color:inherit; text-decoration:none;">
                <i class="fa-solid fa-bag-shopping"></i>
            </a>
        </div>
    </header>

    <main class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <a href="index.html"><span class="bold">ITALION</span></a>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="tab-btn active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
                <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
            </div>

            <!-- Error / Success -->
            <div class="error-msg" id="auth-error"></div>
            <div class="success-msg" id="auth-success"></div>

            <!-- Sign In Panel -->
            <div class="auth-panel active" id="panel-signin">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signin-email" placeholder="your@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signin-password" placeholder="••••••••" autocomplete="current-password">
                </div>
                <button class="auth-btn" id="signin-btn" onclick="doSignIn()">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
                </button>
                <div class="divider">or</div>
                <button class="google-btn" onclick="doGoogleSignIn()">
                    <svg class="google-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.6 0 6.5 1.4 8.6 3.5l6.4-6.4C34.9 2.9 29.8 0 24 0 14.7 0 6.8 5.8 3.2 14.1l7.4 5.8C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.8c4.3-4 6.3-9.8 6.3-17z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6L3.2 14c-1.5 3.1-2.3 6.5-2.3 10s.8 6.9 2.3 10l7.4-5.4z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.4-5.8c-2.1 1.4-4.8 2.3-7.8 2.3-6.3 0-11.6-4-13.4-9.4l-7.4 5.4C6.8 42.2 14.7 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                    Continue with Google
                </button>
            </div>

            <!-- Sign Up Panel -->
            <div class="auth-panel" id="panel-signup">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" placeholder="Your name" autocomplete="name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signup-email" placeholder="your@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password (min. 6 characters)</label>
                    <input type="password" id="signup-password" placeholder="••••••••" autocomplete="new-password">
                </div>
                <button class="auth-btn" id="signup-btn" onclick="doSignUp()">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
                <div class="divider">or</div>
                <button class="google-btn" onclick="doGoogleSignIn()">
                    <svg class="google-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.6 0 6.5 1.4 8.6 3.5l6.4-6.4C34.9 2.9 29.8 0 24 0 14.7 0 6.8 5.8 3.2 14.1l7.4 5.8C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.8c4.3-4 6.3-9.8 6.3-17z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6L3.2 14c-1.5 3.1-2.3 6.5-2.3 10s.8 6.9 2.3 10l7.4-5.4z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.4-5.8c-2.1 1.4-4.8 2.3-7.8 2.3-6.3 0-11.6-4-13.4-9.4l-7.4 5.4C6.8 42.2 14.7 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                    Continue with Google
                </button>
            </div>

            <a href="index.html" class="back-link">← Back to Shop</a>
        </div>
    </main>

    <script type="module" src="login.js"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('panel-' + tab).classList.add('active');
            hideMessages();
        }
        function hideMessages() {
            document.getElementById('auth-error').classList.remove('show');
            document.getElementById('auth-success').classList.remove('show');
        }
        function showError(msg) {
            const el = document.getElementById('auth-error');
            el.textContent = msg;
            el.classList.add('show');
            document.getElementById('auth-success').classList.remove('show');
        }
        function showSuccess(msg) {
            const el = document.getElementById('auth-success');
            el.textContent = msg;
            el.classList.add('show');
            document.getElementById('auth-error').classList.remove('show');
        }
    </script>
</body>
</html>
